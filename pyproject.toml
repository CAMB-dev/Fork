[project]
name = "traffic-bert"
version = "0.1.0"
description = "Byte-BERT based malicious traffic detection from raw payload and packet bytes."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "datasets>=2.20.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "scapy>=2.5.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.0",
    "torch>=2.3.0; sys_platform != 'linux'",
    "torch==2.5.1; sys_platform == 'linux'",
    "torchvision==0.20.1; sys_platform == 'linux'",
    "torchaudio==2.5.1; sys_platform == 'linux'",
    "pytorch-triton-rocm==3.1.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tqdm>=4.66.0",
    "transformers>=4.42.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-rocm62", marker = "sys_platform == 'linux'" },
]
pytorch-triton-rocm = [
    { index = "pytorch-rocm62", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-rocm62", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-rocm62", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm62"
url = "https://mirrors.nju.edu.cn/pytorch/whl/rocm6.2/"
explicit = true

[project.scripts]
traffic-bert = "traffic_bert.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_bert"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
