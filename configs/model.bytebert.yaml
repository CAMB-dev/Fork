tokenizer:
  max_length: 512
  stride: 384

bert:
  hidden_size: 256
  num_hidden_layers: 4
  num_attention_heads: 4
  intermediate_size: 1024
  max_position_embeddings: 512
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1

classifier:
  pooling: mean
  lambda_minor: 1.0
  default_minor_threshold: 0.5

