seed: 42
device: cuda

data:
  train_path: data/processed/cicids2017/all_split_time_block/train.parquet
  val_path: data/processed/cicids2017/all_split_time_block/val.parquet
  label_map: configs/label_map.yaml
  view: payload_only
  max_length: 512
  stride: 384
  max_windows: 8

train:
  epochs: 3
  batch_size: 16
  learning_rate: 0.00003
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  lambda_minor: 1.0
  output_dir: artifacts/cicids2017_all/classifier_time_block
  log_path: artifacts/cicids2017_all/classifier_time_block/train.jsonl
  init_bert_checkpoint: null
  resume_checkpoint: null
